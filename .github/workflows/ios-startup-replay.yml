name: iOS captured startup diagnostics
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Existing Navi iOS artifact run
        type: string
        default: '40117020967'
      mode:
        description: Decode captured test results or replay its preserved app
        type: choice
        default: result
        options:
          - result
          - app
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: macos-26
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          name: navi-ios-${{ inputs.source_run }}
          path: ${{ runner.temp }}/preserved
      - name: Decode original failed XCTest result without rebuilding
        if: ${{ inputs.mode == 'result' }}
        run: python3 tools/private/export_ios_xcresult.py "$RUNNER_TEMP/preserved/ios-tests.xcresult" "$RUNNER_TEMP/replay"
      - name: Replay original preserved app without rebuilding
        if: ${{ inputs.mode == 'app' }}
        run: python3 tools/private/replay_ios_startup.py "$RUNNER_TEMP/preserved/startup-simulator-app.zip" "$RUNNER_TEMP/replay"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-startup-replay-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/replay/*.txt
            ${{ runner.temp }}/replay/*.json
            ${{ runner.temp }}/replay/*.log
            ${{ runner.temp }}/replay/*.png
