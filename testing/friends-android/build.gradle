plugins { id 'com.android.application' version '8.11.1' }

android {
    namespace 'app.organicmaps'
    compileSdk 36
    defaultConfig {
        applicationId 'app.navi.friendstest'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName 'local-emulator-tests'
        multiDexEnabled true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    signingConfigs {
        debug {
            // Existing public upstream development key, never the owner's Navi release key.
            storeFile file('../../android/app/comaps-debug.keystore')
            storePassword '12345678'
            keyAlias 'CoMaps Debug'
            keyPassword '12345678'
        }
    }
    // Compile the production domain/session source, not copies or mocks.
    sourceSets.main.java.srcDir '../../android/app/src/main/java/app/organicmaps/navi/friends'
    sourceSets.main.res.srcDir layout.buildDirectory.dir('generated/navi-res')
}

def copyNaviResources = tasks.register('copyNaviResources', Sync) {
    from '../../android/app/src/main/res'
    include 'values/navi.xml', 'values-night/navi.xml'
    into layout.buildDirectory.dir('generated/navi-res')
}
tasks.named('preBuild').configure { dependsOn copyNaviResources }

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'com.google.android.material:material:1.12.0'
}
